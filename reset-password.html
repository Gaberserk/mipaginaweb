<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body terminal-page">
    <main class="auth-wrapper">
      <div class="terminal-window auth-window">
        <div class="terminal-toolbar"><span></span><span></span><span></span><small>new-password</small></div>
        <section class="auth-card">
          <h1>Nueva contraseña</h1>
          <p>Elige una contraseña nueva para tu cuenta.</p>
          <form id="resetPasswordForm" class="auth-form">
            <label>
              <span>Nueva contraseña</span>
              <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required />
            </label>
            <label>
              <span>Repetir contraseña</span>
              <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" autocomplete="new-password" required />
            </label>
            <button type="submit" class="btn primary full-width">Guardar contraseña</button>
          </form>
          <p id="formMessage" class="auth-message" role="status" aria-live="polite"></p>
          <p class="auth-footer"><a href="login.html">Volver a iniciar sesión</a></p>
        </section>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
