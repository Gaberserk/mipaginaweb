<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body terminal-page">
    <header class="dashboard-header">
      <div class="container dashboard-topbar">
        <div>
          <h1 id="welcomeUser">Bienvenido</h1>
        </div>
        <div class="dashboard-actions">
          <a class="btn secondary" href="dashboard.html">Inicio</a>
          <a class="btn secondary" href="contacto.html">Contacto</a>
          <button id="logoutBtn" class="btn secondary">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="container dashboard-main">
      <section class="stats-grid">
        <article class="stat-card">
          <p>Juegos favoritos</p>
          <strong id="favoriteCount">0</strong>
        </article>
        <article class="stat-card">
          <p>Logros</p>
          <strong>12</strong>
        </article>
        <article class="stat-card">
          <p>Tiempo total</p>
          <strong>24h</strong>
        </article>
      </section>

      <section class="games-section">
        <div class="section-heading">
          <h2>Galería de juegos</h2>
          <p>Próximamente se subirán los juegos aquí.</p>
        </div>
        <div class="early-access-card">
          <p>Mientras tanto, puedes acceder al contenido disponible en early access.</p>
          <a
            class="btn primary"
            href="https://developerberserk.itch.io/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Visitar early access
          </a>
        </div>
      </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
