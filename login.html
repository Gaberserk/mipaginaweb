<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body terminal-page">
    <main class="auth-wrapper">
      <div class="terminal-window auth-window">
        <div class="terminal-toolbar">
          <span></span><span></span><span></span>
          <small>login</small>
        </div>
      <section class="auth-card">
        <h1>Iniciar sesión</h1>
        <p>Introduce tus credenciales para continuar.</p>

        <form id="loginForm" class="auth-form">
          <label>
            <span>Correo electrónico</span>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
          </label>

          <label>
            <span>Contraseña</span>
            <input type="password" id="password" name="password" placeholder="********" required />
          </label>

          <button type="submit" class="btn primary full-width">Entrar</button>
        </form>

        <p class="auth-footer">
          ¿No tienes cuenta?
          <a href="registro.html">Regístrate aquí</a>
        </p>
        <p class="auth-footer"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
      </section>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
