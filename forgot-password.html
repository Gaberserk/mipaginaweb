<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-body terminal-page">
    <main class="auth-wrapper">
      <div class="terminal-window auth-window">
        <div class="terminal-toolbar"><span></span><span></span><span></span><small>recovery</small></div>
        <section class="auth-card">
          <h1>Recuperar contraseña</h1>
          <p>Introduce tu correo y te enviaremos un enlace seguro para cambiarla.</p>
          <form id="forgotPasswordForm" class="auth-form">
            <label>
              <span>Correo electrónico</span>
              <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required />
            </label>
            <button type="submit" class="btn primary full-width">Enviar enlace</button>
          </form>
          <p id="formMessage" class="auth-message" role="status" aria-live="polite"></p>
          <p class="auth-footer"><a href="login.html">Volver a iniciar sesión</a></p>
        </section>
      </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
