<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Godot con IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Asistente Godot con IA</h1>
            <p>Powered by Ollama (Local)</p>
        </header>

        <main>
            <div class="chat-box">
                <div id="messages" class="messages"></div>
            </div>

            <div class="input-section">
                <textarea id="userInput" placeholder="Haz tu pregunta sobre Godot..."></textarea>
                <button id="sendBtn">Enviar</button>
            </div>

            <div class="options">
                <button class="preset" onclick="pregunta('¿Cómo creo un jugador en Godot?')">
                    👤 Crear Jugador
                </button>
                <button class="preset" onclick="pregunta('Genera código para movimiento 2D')">
                    🎮 Movimiento
                </button>
                <button class="preset" onclick="pregunta('¿Cómo uso señales en Godot?')">
                    📡 Señales
                </button>
            </div>
        </main>

        <footer>
            <p>⚠️ Requiere Ollama en http://localhost:11434</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
